:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:#140f3c}
body{margin:0;color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;background:transparent;position:relative;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:9px}::-webkit-scrollbar-track{background:transparent}

/* ---------- living glass background ---------- */
.stage{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#152070 0%,#35197A 42%,#0A5BB0 100%)}
.stage .photo{position:absolute;inset:-4%;background:var(--photo) center/cover;filter:blur(20px) saturate(1.25);opacity:.30;transform:scale(1.08)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 24s ease-in-out infinite alternate;will-change:transform}
.o1{width:560px;height:560px;background:#19D3C5;left:-140px;top:-120px;opacity:.55}
.o2{width:640px;height:640px;background:#FF5FA2;right:-180px;top:18%;opacity:.45;animation-duration:30s}
.o3{width:560px;height:560px;background:#FFC857;left:34%;bottom:-300px;opacity:.30;animation-duration:34s}
.o4{width:480px;height:480px;background:#7C5CFF;left:20%;top:30%;opacity:.40;animation-duration:27s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.18)}}
.stage::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(80% 70% at 50% 30%,#000,transparent);-webkit-mask-image:radial-gradient(80% 70% at 50% 30%,#000,transparent)}

/* ---------- glass ---------- */
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.06));border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.38);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;gap:12px;padding:14px 18px 8px;min-height:100vh}
.glassbar{display:flex;align-items:center;gap:14px;padding:8px 14px;border-radius:26px;direction:ltr;flex:none}
:root[dir="rtl"] .nav,:root[dir="rtl"] .tools{direction:rtl}
.logo-plate{flex:none;background:#fff;border-radius:16px;padding:6px 12px;box-shadow:0 0 0 1px rgba(255,255,255,.7),0 10px 30px rgba(95,216,255,.45)}

.nav{display:flex;gap:4px;padding:4px;border-radius:99px;background:rgba(255,255,255,.10);border:1px solid var(--line);flex:1;min-width:0;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.navb{position:relative;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:0;background:none;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .18s,color .18s,box-shadow .18s}
.navb svg{width:18px;height:18px;flex:none}
.navb:hover{background:rgba(255,255,255,.14);color:#fff}
.navb.on{background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.14));color:#fff;box-shadow:0 6px 18px rgba(10,6,50,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.live{flex:none;display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.10);border:1px solid var(--line);font-weight:600;font-size:13px}
.live b{letter-spacing:.14em;font-size:11.5px;color:#FF8FA3}
.live .dot{width:9px;height:9px;border-radius:50%;background:#FF4D6D;box-shadow:0 0 0 0 rgba(255,77,109,.7);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(255,77,109,0)}100%{box-shadow:0 0 0 0 rgba(255,77,109,0)}}
.tools{display:flex;gap:6px;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.12);color:#fff;padding:8px 13px;border-radius:99px;cursor:pointer;font-weight:600;font-size:13px;transition:all .15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.24);border-color:var(--line2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#45E3D0,#3F8CFF);border-color:transparent;color:#06214A;box-shadow:0 8px 22px rgba(63,140,255,.45)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{padding:8px 10px}
.btn svg{width:17px;height:17px;flex:none}
#btn-voice.off{opacity:.7}#btn-voice.off .wave{display:none}#btn-voice:not(.off) .slash{display:none}
#btn-voice:not(.off){border-color:var(--sky);box-shadow:0 0 16px rgba(95,216,255,.5)}
.pagehead{display:flex;align-items:baseline;gap:14px;flex:none;padding:0 6px}
.pagehead .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.16em;color:var(--gold);font-weight:700;text-transform:uppercase;white-space:nowrap}
.pagehead .eyebrow::before{content:"";width:22px;height:2px;background:var(--gold)}
.pagehead h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(10,6,50,.5)}
.credit{margin-inline-start:auto;align-self:center;display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:99px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid var(--line2);box-shadow:0 8px 22px rgba(10,6,50,.3),inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:12.5px;color:var(--muted);white-space:nowrap}
.credit .ci{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#45E3D0,#3F8CFF);color:#06214A;font-size:12px;font-weight:700}
.credit b{color:#fff;font-weight:700;letter-spacing:.01em}
:where(html.w760) .pagehead{flex-wrap:wrap;row-gap:6px}
:where(html.w760) .credit{margin-inline-start:0;white-space:normal;max-width:100%;flex-wrap:wrap}
.page{flex:1;min-height:0}
.page[hidden]{display:none!important}

/* ---------- fleet page ---------- */
#fleetpage{display:grid;grid-template-columns:minmax(300px,.92fr) minmax(0,1.5fr) minmax(300px,.95fr);gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.hero{position:relative;flex:1.05;min-height:210px;border-radius:26px;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}
.hphoto{position:absolute;inset:0;border-radius:26px;overflow:hidden;border:1px solid var(--line2);box-shadow:var(--shadow);background:var(--photo) center 62%/cover}
.hphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,10,70,.15) 0%,rgba(18,10,70,.05) 40%,rgba(18,10,70,.78) 100%)}
.hchips{position:absolute;inset:10px 10px auto 10px;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px;z-index:2;direction:ltr}
.hchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:700;font-size:11.5px;animation:floaty 5s ease-in-out infinite}
.hchip:nth-child(2){animation-delay:-1.8s}.hchip:nth-child(3){animation-delay:-3.2s}
.hchip b{font-size:13.5px}
@keyframes floaty{50%{transform:translateY(-5px)}}
.hcap{position:absolute;inset-inline-start:16px;bottom:14px;z-index:2;font-weight:700;font-size:15px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hcap small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.char{position:absolute;z-index:3;width:104px;height:auto;filter:drop-shadow(0 12px 14px rgba(8,4,40,.45));animation:bob 3.6s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(-6px)}}
.char .wave{transform-origin:84px 68px;animation:wave 1.5s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
.char .eye{transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.say{position:absolute;z-index:4;max-width:200px;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.94);color:#1B2358;font-size:12.5px;font-weight:700;line-height:1.35;box-shadow:0 10px 26px rgba(8,4,40,.38);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.say::after{content:"";position:absolute;bottom:-7px;inset-inline-end:26px;width:14px;height:14px;background:inherit;transform:rotate(45deg);border-radius:3px}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(8px)}}
#guard{inset-inline-end:6px;bottom:-26px}
#say1{inset-inline-end:84px;bottom:92px}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:none}
.kpi,.kpi-total{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(10,6,50,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.kpi{text-align:start;cursor:pointer;padding:9px 13px 8px;display:flex;flex-direction:column;gap:3px;transition:transform .16s,border-color .16s,box-shadow .16s}
.kpi::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--c);box-shadow:0 0 16px var(--c)}
.kpi:hover{transform:translateY(-2px);border-color:var(--c)}
.kpi.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 28px color-mix(in srgb,var(--c) 45%,transparent)}
.kpi .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .lbl i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.kpi .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kpi .val{font-size:26px;font-weight:700;line-height:1.1}
.kpi .sub{font-size:12px;color:var(--muted);font-weight:600}
.kpi .share{height:4px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden}
.kpi .share i{display:block;height:100%;background:var(--c);border-radius:9px;box-shadow:0 0 10px var(--c)}
.kpi-total{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 16px;background:linear-gradient(135deg,rgba(95,216,255,.34),rgba(124,92,255,.22));border-color:rgba(255,255,255,.5)}
.kpi-total .lbl{font-size:12.5px;color:#E8F4FF}
.kpi-total .big{font-size:38px;font-weight:700;line-height:1.05}
.kpi-total .sub{font-size:12px;color:#D6E8FF}
.ringkpi{position:relative;width:64px;height:64px;flex:none;margin-inline-start:auto}
.ringkpi svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringkpi b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}

.mapcard{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.maphead{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;padding:14px 18px 0;position:relative;z-index:2}
.maphead h2,.pane-h h2{margin:0;font-size:16.5px;font-weight:700}
.maphead p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.clear{display:none;border:1px solid var(--line2);background:rgba(255,255,255,.16);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:12.5px;font-weight:600}
.clear.show{display:inline-flex}.clear:hover{background:rgba(255,255,255,.28)}
.mapwrap{position:relative;direction:ltr;flex:1;min-height:0;padding:0 8px}
.mapwrap svg{display:block;width:100%;height:auto}
.region{cursor:pointer;transition:fill .15s,stroke .15s,fill-opacity .15s}
.region.cov{fill:url(#covg);fill-opacity:.62;stroke:rgba(255,255,255,.9);stroke-width:1.3}
.region.cov:hover{fill-opacity:.9}
.region.cov.sel{fill-opacity:1;stroke:#fff;stroke-width:2.4}
.region.oth{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.26);stroke-width:1;cursor:default}
.rlabel{font-size:14.5px;fill:rgba(255,255,255,.82);text-anchor:middle;pointer-events:none;font-weight:500;paint-order:stroke;stroke:rgba(25,12,90,.9);stroke-width:3px;stroke-linejoin:round}
.rlabel.cov{fill:#fff;font-weight:700}
.sealabel{font-size:15px;fill:rgba(255,255,255,.5);font-style:italic;text-anchor:middle;pointer-events:none;letter-spacing:.08em}
.bub{cursor:pointer}
.bub .halo{fill:none;stroke:#fff;stroke-width:2.5;opacity:0;transition:opacity .15s}
.bub:hover .halo,.bub.sel .halo{opacity:1}
.bub.sel .halo{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{stroke-opacity:1}100%{stroke-opacity:.15}}
.bub .core{fill:rgba(22,10,86,.82)}
.bub text.cnt{fill:#fff;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bub .pill{fill:#fff}
.bub.ws .pill{fill:#FFD27A}
.bub text.nm{fill:#1B2358;font-weight:700;font-size:14.5px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.leader{stroke:#fff;stroke-width:1.2;stroke-dasharray:3 3;opacity:.75}
.pin{fill:#fff;stroke:#2A1670;stroke-width:1.5}
.tip{position:absolute;pointer-events:none;z-index:6;min-width:210px;background:rgba(30,20,100,.9);backdrop-filter:blur(16px);border:1px solid var(--line2);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 16px 40px rgba(8,4,40,.6);font-size:13px;opacity:0;transition:opacity .1s;direction:inherit}
.tip.show{opacity:1}.tip h4{margin:0 0 2px;font-size:15px}.tip .sm{color:var(--muted);font-size:12px;margin-bottom:8px}
.tip .row{display:flex;align-items:center;gap:8px;padding:2px 0}.tip .row i{width:9px;height:9px;border-radius:50%;flex:none}.tip .row b{margin-inline-start:auto}
.mapdonut{position:absolute;right:14px;bottom:44px;width:106px;height:106px;z-index:3;pointer-events:none}
.mapdonut svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 6px 14px rgba(8,4,40,.5))}
.mapdonut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:inherit}
.mapdonut .dc b{font-size:21px;line-height:1}.mapdonut .dc span{font-size:10.5px;color:var(--muted);margin-top:3px;text-align:center;max-width:70px;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 18px 12px;font-size:12px;color:var(--muted);position:relative;z-index:2}
.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:9px;height:9px;border-radius:50%}

.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px 8px}
.cnt{color:var(--muted);font-size:12.5px;font-weight:500}
.seg,.iseg{display:inline-flex;background:rgba(255,255,255,.12);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button,.iseg button{border:0;background:none;padding:5px 14px;border-radius:99px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button.on{background:#fff;color:#2A1670;box-shadow:0 4px 12px rgba(8,4,40,.3)}
.iseg button .n{background:rgba(255,255,255,.18);color:#fff;border-radius:99px;min-width:22px;padding:0 7px;font-size:11.5px;text-align:center}
.iseg button.on{background:#fff;color:#2A1670;box-shadow:0 4px 12px rgba(8,4,40,.3)}
.iseg button.on .n{background:var(--c,var(--sky));color:#fff}
#branchpane{flex:1.25}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 14px 14px;overflow-y:auto;flex:1;min-height:0;align-content:start;-webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent);mask-image:linear-gradient(to bottom,#000 88%,transparent)}
.bc{position:relative;text-align:start;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.10);border-radius:16px;padding:7px 11px 8px;transition:transform .16s,border-color .16s,background .16s,box-shadow .16s;display:flex;flex-direction:column;gap:3px;min-width:0}
.bc:hover{transform:translateY(-2px);background:rgba(255,255,255,.2);border-color:var(--line2)}
.bc.on{background:rgba(255,255,255,.26);border-color:#fff;box-shadow:0 0 0 1px #fff,0 0 24px rgba(95,216,255,.5)}
.bc .n{font-weight:700;font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc .r1b{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.bc .r1b b{font-size:17px;line-height:1.1}.bc .r1b .av{font-size:12px}
.av{font-weight:700}.av.hi{color:#58F2BD}.av.mid{color:#FFD27A}.av.lo{color:#FF8FA3}
.stack{display:flex;height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.14);gap:1.5px}
.stack i{display:block;height:100%;min-width:3px}

/* live cards */
.spot{flex:none;padding:10px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;min-height:112px}
.spot .ttl{font-size:11.5px;letter-spacing:.12em;color:var(--gold);font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.spot .ttl i{width:7px;height:7px;border-radius:50%;background:#FF4D6D;animation:ping 1.6s infinite}
.spot .nm{font-size:20px;font-weight:700;line-height:1.2;margin:2px 0}
.spot .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.spot .chips span{font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 25%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.spring{position:relative;width:82px;height:82px;flex:none}
.spring svg{width:100%;height:100%;transform:rotate(-90deg)}
.spring svg circle.v{transition:stroke-dasharray .9s ease}
.spring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.fadein{animation:fadein .6s ease}
@keyframes fadein{from{opacity:.3;transform:translateY(6px)}}
.feedcard{flex:1;min-height:118px;padding:12px 16px;display:flex;flex-direction:column;overflow:hidden}
.feedcard .ttl{font-size:11.5px;letter-spacing:.12em;color:var(--gold);font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.feedcard .ttl i{width:7px;height:7px;border-radius:50%;background:#2EE6A6;animation:ping 1.6s infinite}
.feed{display:flex;flex-direction:column;gap:6px;overflow:hidden;flex:1}
.fi{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);font-size:12.5px;font-weight:600;animation:fadein .5s ease both}
.fi .ic{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:color-mix(in srgb,var(--c) 28%,transparent)}
.fi:first-child{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}

/* ---------- drawer (vehicle registers) ---------- */
.dback{position:fixed;inset:0;z-index:38;background:rgba(14,8,60,.45);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer{position:fixed;inset-inline:18px;bottom:calc(var(--sbh,38px) + 24px);height:min(62vh,560px);z-index:40;display:flex;flex-direction:column;transform:translateY(125%);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.2,.85,.25,1),opacity .25s;background:linear-gradient(135deg,rgba(60,40,160,.78),rgba(25,30,120,.78))}
body.drawer-open .drawer{transform:none;opacity:1;pointer-events:auto}
body.drawer-open .dback{opacity:1;pointer-events:auto}
.dclose{border:1px solid var(--line2);background:rgba(255,255,255,.14);border-radius:99px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1}
.dclose:hover{background:rgba(255,80,110,.4)}
.fab{position:fixed;left:50%;bottom:calc(8px + (var(--sbh,38px) - 38px)/2);transform:translateX(-50%);z-index:41;display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:99px;border:1px solid rgba(255,255,255,.55);background:linear-gradient(135deg,#45E3D0,#3F8CFF);color:#06214A;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 14px 34px rgba(63,140,255,.55);transition:transform .2s}
.fab:hover{transform:translateX(-50%) translateY(-3px)}
.fab svg{width:19px;height:19px}.fab .fn{background:#06214A;color:#fff;border-radius:99px;padding:0 9px;font-size:12px}
.fab.on{background:rgba(255,255,255,.92)}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:2px 16px 10px}
.filters input,.filters select{background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:99px;padding:8px 14px;min-width:0;font-size:13.5px}
.filters input{flex:3 1 240px}.filters select{flex:1 1 140px;cursor:pointer}
.filters input:focus,.filters select:focus{border-color:#fff;background:rgba(255,255,255,.22);outline:none}
.filters input::placeholder{color:var(--dim)}
.filters select option{background:#2A1B7A;color:#fff}
.tablewrap{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:600px}
th{position:sticky;top:0;z-index:1;text-align:start;font-size:12px;color:var(--muted);font-weight:600;padding:9px 14px;background:rgba(40,25,130,.92);cursor:pointer;white-space:nowrap;user-select:none;border-bottom:1px solid var(--line)}
th:hover{color:#fff}th .ar{opacity:.55;margin-inline-start:4px;font-size:10px}
td{padding:6px 14px;border-bottom:1px solid rgba(255,255,255,.1);font-size:13.2px;white-space:nowrap}
td:nth-child(4),td:nth-child(5){white-space:normal;line-height:1.3}
tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover td{background:rgba(255,255,255,.12)}
td small.sub{display:block;color:var(--muted);font-size:11px;line-height:1.2;margin-top:1px}
.plate{display:inline-block;background:#fff;color:#0B1F3A;border:2px solid #0B1F3A;border-radius:7px;padding:0 10px;font-weight:700;letter-spacing:.05em;font-size:13px;unicode-bidi:plaintext;box-shadow:0 3px 8px rgba(8,4,40,.35)}
.badge{display:inline-flex;align-items:center;gap:7px;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 24%,transparent);color:#fff;border:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.dash{color:var(--dim)}
.days{display:inline-block;min-width:58px;text-align:center;padding:1px 10px;border-radius:99px;font-weight:700;font-size:12.5px;background:color-mix(in srgb,var(--c) 26%,transparent);color:#fff;border:1px solid color-mix(in srgb,var(--c) 65%,transparent)}
.empty,.iempty{padding:34px 18px;text-align:center;color:var(--muted)}
.okshield{font-size:52px;line-height:1;margin-bottom:8px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(8,4,40,.4))}
.iempty b{display:block;color:#58F2BD;font-size:15px;margin-bottom:3px}
.notes{padding:0}.notes:empty{display:none}
.note{display:flex;gap:9px;align-items:flex-start;padding:8px 14px;border-top:1px solid rgba(255,210,122,.4);background:rgba(255,184,77,.14);font-size:12px;color:#FFE6B0}
.note svg{width:16px;height:16px;flex:none;margin-top:2px;color:#FFB84D}

/* ---------- insurance page ---------- */
#inspage{display:flex;flex-direction:column;gap:14px}
.iscope{display:none;align-items:center;gap:10px;flex:none;font-size:13px;color:var(--muted)}
.iscope span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid var(--line2);border-radius:99px;padding:4px 14px}
.iscope b{color:#fff}
.iscope button{border:1px solid var(--line2);background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:4px 14px;cursor:pointer;font-size:12.5px;font-weight:600}
.irowTop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 170px;gap:14px;flex:none;align-items:stretch}
.iboxes{display:contents}
.ibox{position:relative;overflow:hidden;text-align:start;cursor:pointer;display:flex;align-items:center;gap:16px;padding:14px 20px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.38);transition:transform .16s,border-color .16s,box-shadow .16s}
.ibox::after{content:"";position:absolute;inset-inline-end:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%)}
.ibox:hover{transform:translateY(-3px);border-color:var(--c)}
.ibox.on{border-color:#fff;box-shadow:0 0 0 2px var(--c),0 0 34px color-mix(in srgb,var(--c) 55%,transparent)}
.gauge{position:relative;width:92px;height:92px;flex:none;z-index:1}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge circle.v{transition:stroke-dasharray 1s ease;filter:drop-shadow(0 0 6px var(--c))}
.gauge .gc{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:19px}
.ibx{min-width:0;flex:1;position:relative;z-index:1}
.ibx .lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.ibx .val{font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.ibx .sub{font-size:12px;color:var(--muted);margin-top:2px}
.irow2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;flex:1;min-height:0}
.ihint{margin:0 14px 8px;padding:7px 12px;border-radius:14px;background:rgba(255,255,255,.1);border:1px dashed var(--line2);font-size:12.5px;color:var(--muted)}
.ihint b{color:#fff}
.ileg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.ileg span{display:inline-flex;align-items:center;gap:6px}.ileg i{width:9px;height:9px;border-radius:50%}
.icovlist{flex:1;min-height:0;overflow:auto;padding:0 12px 10px}
.icr{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 36px 44px;gap:10px;align-items:center;width:100%;padding:6px 8px;border:0;border-radius:12px;background:none;cursor:pointer;text-align:start;color:#fff}
.icr:hover,.icr.on{background:rgba(255,255,255,.14)}
.icr.on{box-shadow:inset 0 0 0 1px #fff}
.icr .n{font-weight:600;font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icr .stack{height:10px}.icr .t{font-weight:700;text-align:end}.icr .p{font-weight:700;text-align:end;font-size:12.5px}
.imissing{padding:34px 24px;text-align:center;color:var(--muted);font-size:15px}
.imissing b{display:block;color:#fff;font-size:18px;margin-bottom:6px}
#guard2{position:relative;display:block;margin:0 auto;inset:auto;width:112px;align-self:end}
.mgr{position:relative;align-self:end;height:100%;min-height:150px}
.mgr .char{position:absolute;inset-inline-end:8px;bottom:-14px;width:100px}
.mgr .say{inset-inline-end:60px;bottom:128px;max-width:210px}

/* ---------- details pop-up ---------- */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(14,8,60,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:16px}
.modal.show{display:flex}
.mcard{position:relative;width:min(640px,100%);max-height:90vh;overflow:auto;background:linear-gradient(135deg,rgba(70,48,185,.88),rgba(24,34,130,.88));border:1px solid var(--line2);border-radius:28px;padding:22px 26px 24px;box-shadow:0 34px 90px rgba(6,2,40,.7),inset 0 1px 0 rgba(255,255,255,.4);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.mcard::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:linear-gradient(90deg,#45E3D0,#FFD27A,#FF7EC7)}
.mx{position:absolute;inset-inline-end:14px;top:12px;border:1px solid var(--line2);background:rgba(255,255,255,.14);border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:20px;line-height:1}
.mx:hover{background:rgba(255,80,110,.45)}
.mh{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-inline-end:44px}
.mh .no{font-size:30px;font-weight:700;line-height:1}.mh .lbl{font-size:11.5px;color:var(--muted);display:block;margin-bottom:2px}
.msec{margin-top:16px}
.msec h3{margin:0;font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.msec h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,210,122,.6),transparent)}
:root[dir="rtl"] .msec h3::after{background:linear-gradient(270deg,rgba(255,210,122,.6),transparent)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin-top:8px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.18)}
.mgrid div{background:rgba(30,20,110,.7);padding:9px 14px;min-width:0}
.mgrid span{display:block;font-size:11.5px;color:var(--muted)}
.mgrid b{display:block;font-weight:600;font-size:13.5px;word-break:break-word}
.mgrid b span{display:inline;font-size:inherit;color:inherit}.mgrid b .dash{color:var(--dim);font-weight:500}
.mgrid .wide{grid-column:1/-1}
@media (max-width:520px){.mgrid{grid-template-columns:1fr}}

/* ---------- bottom bar, toast, drop ---------- */
.sbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 18px;padding:6px 16px;border-radius:99px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.10);border:1px solid var(--line)}
.sbar .filemeta,.sbar .clock{display:flex;flex-wrap:wrap;gap:2px 14px;margin:0;font-size:12px;align-items:baseline;max-width:calc(50% - 128px)}
.sbar b{color:#fff;font-weight:600}
.sbar .clock b{font-size:12.5px}
.st-ok{color:#58F2BD;font-weight:600}.st-bad{color:#FF8FA3;font-weight:700}
.ver{background:rgba(255,210,122,.2);border:1px solid rgba(255,210,122,.6);color:#FFE2A8;border-radius:6px;padding:0 7px;font-weight:700;font-size:11px}
.toast{position:fixed;inset-inline:0;bottom:calc(var(--sbh,38px) + 34px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:rgba(30,20,110,.95);border:1px solid var(--line2);color:#fff;padding:12px 20px;border-radius:99px;box-shadow:0 14px 40px rgba(6,2,40,.6);font-size:14px;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;z-index:80}
.toast.show{opacity:1;transform:none}.toast.err{background:rgba(160,30,70,.96)}
.drop{position:fixed;inset:0;z-index:90;background:rgba(14,8,60,.88);color:#fff;display:none;align-items:center;justify-content:center;font-size:24px;font-weight:700;border:3px dashed var(--sky);margin:12px;border-radius:28px}
.drop.show{display:flex}

/* ===== fit-to-screen ===== */
html.fit,html.fit body{height:100%;overflow:hidden}

/* ===== bigger map ===== */
.colM .spot{height:86px;min-height:86px;max-height:86px;overflow:hidden;box-sizing:border-box}
.mapcard .legend{position:absolute;inset-inline-end:10px;inset-inline-start:auto;top:10px;bottom:auto;z-index:3;display:grid;grid-template-columns:auto auto;column-gap:12px;row-gap:2px;align-items:center;padding:5px 9px;border-radius:12px;background:rgba(20,12,80,.30);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:10.5px;max-width:190px;white-space:nowrap}
html[lang="ar"] .mapcard .maphead{position:static}
html[lang="ar"] .mapcard .clear{position:absolute;inset-inline-end:12px;bottom:12px;top:auto;z-index:4;padding:4px 12px}
.mapcard .legend span{gap:5px}
.mapcard .legend i{width:8px;height:8px}
.mapcard .legend span[style*="margin-inline-start"]{grid-column:1/-1;margin:2px 0 0!important;font-size:9.5px;white-space:normal;line-height:1.2}
html[lang="en"] .mapcard .legend{font-size:10px;max-width:130px;grid-template-columns:auto;top:64px;row-gap:1px}
html[lang="en"] .mapcard:has(.clear.show) .legend{top:64px}
.mapcard .maphead{padding-top:12px}
.mapdonut{bottom:14px}

/* ===== background: vehicle scene photo behind the transparent glass panels (dark navy tint from the v4 look) ===== */
html{background:#050B18}
.stage{background:#050B18}
.stage .photo{display:block;position:absolute;inset:0;background:var(--photo) center 58%/cover no-repeat;filter:none;opacity:1;transform:none;z-index:0}
.stage .orb{display:none}
.stage::before{content:"";position:absolute;inset:0;z-index:1;background:
  radial-gradient(90% 60% at 12% 0%,rgba(47,127,216,.20),transparent 60%),
  radial-gradient(70% 55% at 100% 100%,rgba(47,127,216,.14),transparent 60%),
  linear-gradient(180deg,rgba(7,18,42,.48) 0%,rgba(5,11,24,.66) 100%)}
.stage::after{z-index:2;background-image:linear-gradient(rgba(130,175,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(130,175,255,.03) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(80% 80% at 50% 30%,#000,transparent);-webkit-mask-image:radial-gradient(80% 80% at 50% 30%,#000,transparent)}
</style>
</head>

function statusKey(raw){

  if(n.includes("حادث")||n.includes("accident")) return "accident";

let voiceOn=true, warnedNoAr=false, VOICES=[];
const TTS="speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function loadVoices(){ if(TTS) VOICES=speechSynthesis.getVoices()||[]; }
if(TTS){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(){
  const pref=lang==="ar"?["ar-sa","ar"]:["en-gb","en-us","en"];
  for(const p of pref){ const v=VOICES.find(x=>x.lang&&x.lang.toLowerCase().startsWith(p)); if(v) return v; }
  return null;
}
let LAST_UTT=null, speakT=null;
function speak(text){
  if(!voiceOn||!TTS) return;
  try{
    if(!VOICES.length) loadVoices();
    speechSynthesis.cancel(); clearTimeout(speakT);
    speakT=setTimeout(()=>{
      try{
        speechSynthesis.resume();
        const u=new SpeechSynthesisUtterance(text), v=pickVoice();
        if(v){ u.voice=v; u.lang=v.lang; }
        else { u.lang=lang==="ar"?"ar-SA":"en-GB"; if(lang==="ar"&&!warnedNoAr&&VOICES.length){ warnedNoAr=true; toast(t("noArVoice"),true); } }
        u.rate=.95; u.pitch=1; LAST_UTT=u;
        u.onerror=ev=>{ if(ev&&ev.error==="not-allowed") toast(t("voiceBlocked"),true); };
        speechSynthesis.speak(u);
      }catch(e){}
    },80);
  }catch(e){}
}

/* ---------- Remember the last uploaded file (survives refresh / reopening) ---------- */
const STORE_KEY="apsg_fleet_data_v1";
function idb(){ return new Promise((res,rej)=>{ try{ const rq=indexedDB.open("apsg_fleet",1); rq.onupgradeneeded=()=>rq.result.createObjectStore("kv"); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }catch(e){rej(e);} }); }
async function idbPut(v){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,STORE_KEY); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(){ const db=await idb(); return new Promise((res,rej)=>{ const rq=db.transaction("kv").objectStore("kv").get(STORE_KEY); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); }); }
async function idbDel(){ try{ const db=await idb(); db.transaction("kv","readwrite").objectStore("kv").delete(STORE_KEY); }catch(e){} }
function sessSave(rec){ let ok=false; const s=JSON.stringify(rec);
  try{ sessionStorage.setItem(STORE_KEY,s); ok=true; }catch(e){}
  try{ window.name="APSGDATA:"+s; ok=true; }catch(e){}
  return ok; }
function sessLoad(){
  try{ const s=sessionStorage.getItem(STORE_KEY); if(s) return JSON.parse(s); }catch(e){}
  try{ if(typeof window.name==="string"&&window.name.indexOf("APSGDATA:")===0) return JSON.parse(window.name.slice(9)); }catch(e){}
  return null; }
function sessClear(){ try{sessionStorage.removeItem(STORE_KEY);}catch(e){} try{ if(String(window.name).indexOf("APSGDATA:")===0) window.name=""; }catch(e){} }
async function saveUpload(name,sheets){
  const rec={name,ts:Date.now(),sheets};
  let persistent=false;
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(rec)); persistent=true; try{ await idbDel(); }catch(e){} }
  catch(e){ try{ try{localStorage.removeItem(STORE_KEY);}catch(x){} await idbPut(rec); persistent=true; }catch(e2){} }
  const sess=sessSave(rec);   // extra safety net: survives a refresh even if browser storage is blocked
  return persistent?"ok":(sess?"session":"bad");
}
function loadSavedSync(){ try{ const s=localStorage.getItem(STORE_KEY); if(s) return JSON.parse(s); }catch(e){} return null; }
async function clearSaved(){ try{localStorage.removeItem(STORE_KEY);}catch(e){} sessClear(); await idbDel(); }

/* ---------- Built-in Excel reader (works offline, no internet needed) ---------- */
async function inflateRaw(u8){
  const ds=new DecompressionStream("deflate-raw");
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());
}
async function readXlsxNative(buf){
  if(typeof DecompressionStream==="undefined") throw new Error("no-inflate");
  const u8=new Uint8Array(buf), dv=new DataView(buf), dec=new TextDecoder();
  let e=u8.length-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error("not-zip");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const files={};
  for(let i=0;i<n;i++){
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    files[dec.decode(u8.subarray(p+46,p+46+nl))]={method:dv.getUint16(p+10,true),csize:dv.getUint32(p+20,true),lho:dv.getUint32(p+42,true)};
    p+=46+nl+el+cl;
  }
  const get=async name=>{ const f=files[name]; if(!f) return null; const lp=f.lho, s=lp+30+dv.getUint16(lp+26,true)+dv.getUint16(lp+28,true); const d=u8.subarray(s,s+f.csize); return dec.decode(f.method===0?d:await inflateRaw(d)); };
  const xml=s=>new DOMParser().parseFromString(s,"application/xml");
  const tag=(d,n)=>Array.from(d.getElementsByTagNameNS("*",n));
  const wbx=xml(await get("xl/workbook.xml")), relx=xml(await get("xl/_rels/workbook.xml.rels")), rel={};
  tag(relx,"Relationship").forEach(r=>rel[r.getAttribute("Id")]=r.getAttribute("Target"));
  const sst=[]; const sx=await get("xl/sharedStrings.xml");
  if(sx) tag(xml(sx),"si").forEach(si=>sst.push(tag(si,"t").filter(x=>x.parentNode.localName!=="rPh").map(x=>x.textContent).join("")));
  const colIdx=s=>{let n=0;for(const ch of s) n=n*26+ch.charCodeAt(0)-64;return n-1;};
  const out={};

function parseCsv(text){

  if(q) rows=rows.filter(v=>norm([v.no,v.plate,plateText(v.plate),v.type,BRANCHES[v.branch].ar,BRANCHES[v.branch].en,regionName(regionOfBranch(v.branch)),STATUS[v.status].ar,STATUS[v.status].en,v.insNo||"",ti(ICLS[v.cls].k)].concat(v.raw.map(x=>x[1])).join(" ")).includes(q));
  const bs=branchStats().sort((a,b)=>b.total-a.total), bo=Object.fromEntries(bs.map((b,i)=>[b.k,i]));
  const numv=v=>{const n=parseFloat(v.no);return isNaN(n)?1e9:n;};
  const keyf={no:numv,plate:v=>v.plate,type:v=>v.type||"~",region:v=>regionName(regionOfBranch(v.branch)),branch:v=>bo[v.branch]*1e5+(numv(v)>1e8?0:numv(v)),status:v=>SKEYS.indexOf(v.status),ins:v=>v.cls,end:v=>v.insEnd?+v.insEnd:1e15,left:v=>v.left==null?1e9:v.left}[S.sortKey]||(v=>0);
  rows=rows.slice().sort((a,b)=>{const x=keyf(a),y=keyf(b);return (x<y?-1:x>y?1:0)*S.sortDir;});
  $("regcount").textContent=`${scopeLabel()} · ${t("vehiclesN")(fmt(rows.length))}`;
  const arrow=k=>S.sortKey===k?(S.sortDir>0?"▲":"▼"):"↕";
  const cols=[["no",t("cNo")],["plate",t("cPlate")],["type",t("cType")],["branch",t("cBranch")],["status",t("cStatus")]].concat(hasIns?[["ins",ti("cIns")],["end",ti("cEnd")],["left",ti("cLeft")]]:[]);
  $("thead").innerHTML="<tr>"+cols.map(([k,l])=>`<th data-sort="${k}" scope="col">${esc(l)}<span class="ar">${arrow(k)}</span></th>`).join("")+"</tr>";
  CUR=rows;
  $("tbody").innerHTML=rows.length?rows.map((v,i)=>`<tr data-i="${i}"><td class="num" dir="auto">${esc(v.no)}</td><td><span class="plate" dir="auto">${esc(plateText(v.plate))}</span></td>
    <td>${v.type?esc(trv(v.type)):'<span class="dash">—</span>'}${(v.maker||v.year)?`<small class="sub">${esc([trv(v.maker),v.year].filter(Boolean).join(" · "))}</small>`:""}</td>
    <td title="${esc(nameOf(BRANCHES[v.branch]))}">${esc(BRANCHES[v.branch][lang+"s"]||nameOf(BRANCHES[v.branch]))}</td>
    <td><span class="badge" style="--c:${STATUS[v.status].c}"><i></i>${esc(STATUS[v.status][lang])}</span></td>`
    +(hasIns?`<td>${insBadge(v)}</td><td class="num">${v.insEnd?fmtDate(v.insEnd):'<span class="dash">—</span>'}</td><td>${daysChip(v)}</td>`:"")+`</tr>`).join(""):`<tr><td colspan="${cols.length}" class="empty">${t("none")}</td></tr>`;
}
function renderSoon(){
  const has=DATA.endFound!==false, sc=scoped();
  $("t-isoon").innerHTML=`${esc(ti("soon"))}<small style="display:block;font-size:11.5px;font-weight:500;color:var(--muted)">${esc(ti("autoNote"))}</small>`;
  if(!has){ $("itabs").innerHTML=""; $("isoonhint").innerHTML=`<b>${esc(ti("missingT"))}</b> ${esc(ti("missingS"))}`; $("ishead").innerHTML=""; $("isbody").innerHTML=""; CUR_SOON=[]; return; }
  const c=w=>w==="expired"?sc.filter(v=>v.cls==="expired").length:sc.filter(v=>v.left!=null&&v.left>=0&&v.left<=+w).length;
  $("itabs").innerHTML=[["expired","tabExpired","#F0535A"],["30","tab30","#F0535A"],["60","tab60","#FF7A3D"],["90","tab90","#F5B731"]].map(([k,l,col])=>`<button type="button" data-iwin="${k}" class="${S.iwin===k?"on":""}" style="--c:${col}">${esc(ti(l))}<span class="n num">${c(k)}</span></button>`).join("");
  const list=soonList(), future=sc.filter(v=>v.left!=null&&v.left>=0).sort((a,b)=>a.left-b.left)[0]; let hint="";
  if(S.iwin!=="expired"&&!list.length) hint=`${esc(ti("hintNone"))} <b>${S.iwin} ${esc(ti("days"))}</b>.`+(future?` ${esc(ti("hintNear"))}: <b class="num">${fmtDate(future.insEnd)}</b> (${esc(ti("hintIn"))} <b class="num">${fmt(future.left)}</b> ${esc(ti("days"))}).`:"");
  else if(S.iwin==="expired"&&!list.length) hint=esc(ti("noExpired"))+".";
  else hint=`<b class="num">${esc(ti("vehiclesN")(fmt(list.length)))}</b>`;
  $("isoonhint").innerHTML=hint;
  const cols=[["no","cNo"],["plate","cPlate"],["branch","cBranch"],["end","cEnd"],["left","cLeft"]], arrow=k=>S.isk===k?(S.isd>0?"▲":"▼"):"↕";
  $("ishead").innerHTML="<tr>"+cols.map(([k,l])=>`<th data-isort="${k}">${esc(ti(l))}<span class="ar">${arrow(k)}</span></th>`).join("")+"</tr>";
  const kf={no:v=>parseFloat(v.no)||0,plate:v=>v.plate,branch:v=>ibn(v.branch),insNo:v=>v.insNo,end:v=>v.insEnd?+v.insEnd:0,left:v=>v.left==null?1e9:v.left}[S.isk];
  list.sort((a,b)=>{const x=kf(a),y=kf(b);return (x<y?-1:x>y?1:0)*S.isd;}); CUR_SOON=list;
  $("isbody").innerHTML=list.length?list.map((v,i)=>`<tr data-s="${i}"><td class="num">${esc(v.no)}</td><td><span class="plate" dir="auto">${esc(plateText(v.plate))}</span></td><td>${esc(ibn(v.branch))}</td><td class="num">${fmtDate(v.insEnd)}</td><td>${daysChip(v)}</td></tr>`).join("")
    :`<tr><td colspan="5" class="iempty"><div class="ie"><div class="okshield">🛡️</div><b>✓ ${esc(ti("allClear"))}</b><span>${S.iwin==="expired"?"":esc(ti("allClearSub"))}</span></div></td></tr>`;
}
function renderIns(){ renderSoon(); }
function renderAll(){
  TODAY=startOfDay(new Date()); DATA.vehicles.forEach(classify);
  renderStatic(); renderMeta(); renderKPIs(); renderMap(); bindMap(); renderCards(); renderSoon(); renderRegister(); renderLive();
}
function speakScope(){
  const sc=scoped(), T=tally(sc), name=scopeLabel(), a=avp(T.by,T.total), L=lang==="ar", c={insured:0,uninsured:0,expired:0}; sc.forEach(v=>c[v.cls]++);
  const w=k=>sc.filter(v=>v.left!=null&&v.left>=0&&v.left<=k).length, hasIns=DATA.endFound!==false;
  const b=T.by;
  let s=L?`${name}. إجمالي المركبات ${T.total}. نسبة الجاهزية ${a==null?"غير متاحة":a+" بالمئة"}. في الخدمة ${b.operational}، تحت الصيانة ${b.maintenance}، توضيب المحرك ${b.overhaul}، إحلال ${b.writtenoff}، حوادث ${b.accident}.`
         :`${name}. ${T.total} vehicles. Availability ${a==null?"not available":a+" percent"}. In service ${b.operational}, under maintenance ${b.maintenance}, engine overhaul ${b.overhaul}, replacement ${b.writtenoff}, accidents ${b.accident}.`;
  if(hasIns) s+=L?` مؤمنة ${c.insured}، غير مؤمنة ${c.uninsured}، منتهية التأمين ${c.expired}. ${w(90)?`ينتهي تأمين ${w(30)} مركبة خلال 30 يوماً، و${w(60)} خلال 60 يوماً، و${w(90)} خلال 90 يوماً.`:"لا توجد وثائق تنتهي خلال 90 يوماً."}`
                 :` Insured ${c.insured}, uninsured ${c.uninsured}, expired ${c.expired}. ${w(90)?`Expiring within 30 days: ${w(30)}, 60 days: ${w(60)}, 90 days: ${w(90)}.`:"No policies expire within 90 days."}`;
  speak(s);

  el.style.animation="none"; void el.offsetHeight; el.style.animation="";

function renderLive(){
  $("t-feed").textContent=t5("feed");
  $("credit").innerHTML="";
  $("fab-t").textContent=t("register"); $("fab-n").textContent=CUR.length;
  renderHero(); renderSpot(); renderFeed(); renderSay(); liveTime(); syncBar();

function startLive(){
  window.addEventListener("resize",()=>{syncBar();renderFeed();}); try{ new ResizeObserver(syncBar).observe(document.querySelector(".sbar")); }catch(e){}
  $("fab").onclick=()=>setDrawer(!DRAWER); $("dback").onclick=()=>setDrawer(false);
  document.querySelectorAll(".dclose").forEach(b=>b.onclick=()=>setDrawer(false));
  $("f-ins").addEventListener("change",e=>{S.ins=e.target.value||null;renderAll();});
  $("spot").onclick=()=>{ const k=$("spot").dataset.k; if(k) pick("branch",k); };
  $("spot").addEventListener("mouseenter",()=>SPOT_HOLD=true); $("spot").addEventListener("mouseleave",()=>SPOT_HOLD=false);
  // extra tile / switch clicks (the older handler already deals with data-status)
  document.addEventListener("click",e=>{
    let el;
    if((el=e.target.closest("[data-ins]"))){ S.ins=S.ins===el.dataset.ins?null:el.dataset.ins; renderAll(); if(S.ins) setDrawer(true); return; }
    if((el=e.target.closest("[data-total]"))){ S.status=null; S.ins=null; renderAll(); setDrawer(true); return; }
    if((el=e.target.closest("[data-status]"))){ if(S.status===el.dataset.status) setDrawer(true); return; }
    if((el=e.target.closest("#cseg button"))){ S.cmode=el.dataset.cmode; renderCards(); return; }
  });
  const hero=$("hero");
  hero.addEventListener("mousemove",e=>{ const r=hero.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5; hero.style.setProperty("--ry",(x*9).toFixed(2)+"deg"); hero.style.setProperty("--rx",(-y*7).toFixed(2)+"deg"); });
  hero.addEventListener("mouseleave",()=>{ hero.style.setProperty("--ry","0deg"); hero.style.setProperty("--rx","0deg"); });
  setInterval(()=>{ if(!document.hidden) liveTime(); },1000);
  setInterval(()=>{ if(document.hidden) return; FEED_I++; renderFeed(); },4500);
  setInterval(()=>{ if(document.hidden||SPOT_HOLD) return; SPOT_I++; renderSpot(); },6000);
  setInterval(()=>{ if(document.hidden) return; SAY_I++; renderSay(); },7500);
}

  const insChip=DATA.endFound===false?"":`<span style="--c:#22C58B">🛡 ${esc(ti("sInsured"))} ${insN}/${bv.length}</span>`;
  $("spot").dataset.k=b.k;
  $("spot").innerHTML=`<div class="spring fadein">${ringSvg(a==null?0:a/100,col)}<b class="num">${a==null?"—":a+"%"}</b></div>
   <div class="stxt fadein"><div class="ttl"><i></i>${esc(t5("spot"))}</div><div class="nm" title="${esc(nameOf(BRANCHES[b.k]))}">${esc(BRANCHES[b.k][lang+"s"]||nameOf(BRANCHES[b.k]))}</div><div class="cntl">${esc(t("vehiclesN")(fmt(b.total)))}</div></div>
   <div class="chips fadein">${SKEYS.filter(k=>k!=="unknown"&&b.by[k]>0).slice(0,4).map(k=>`<span style="--c:${STATUS[k].c}">${esc(STATUS[k][lang])} ${b.by[k]}</span>`).join("")}${insChip}</div>`;
}

/* ===== مسار 360: مصدر البيانات = قاعدة الأسطول في النظام (نافذة مسار الأم) ===== */
(function start(){
  const KEEP=["branch","region","status","q","ws","ins","iq","view","cmode","sortKey","sortDir","iwin","isk","isd","irk","ird"];
  function src(){ try{ if(window.parent&&window.parent!==window&&typeof window.parent.m360FleetSheets==="function") return window.parent.m360FleetSheets(); }catch(e){} return null; }
  function pull(keep){
    const d=src(); if(!d||!d.sheets) return false;
    const old={}; if(keep) KEEP.forEach(k=>old[k]=S[k]);
    if(!setData(d.sheets,d.name||DEFAULT_FILE)) return false;
    if(keep){ KEEP.forEach(k=>{ if(old[k]!==undefined) S[k]=old[k]; }); if(S.branch&&!DATA.vehicles.some(v=>v.branch===S.branch)) S.branch=null; }
    DATA.stamp=d.stamp||Date.now(); STORE_STATE=""; renderAll(); return true;
  }
  /* يستدعيها مسار عند كل تحديث (كل دقيقة في الشاشة التنفيذية) — تحافظ على التصفية الحالية */
  window.m360Refresh=function(){ try{ return pull(true); }catch(e){ return false; } };
  if(!pull(false)){
    const m=document.createElement("div");
    m.setAttribute("style","position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(5,12,30,.92);color:#fff;font:600 18px 'IBM Plex Sans Arabic',sans-serif;text-align:center;padding:24px;line-height:1.9");
    m.innerHTML='<div>🔒 لوحة الأسطول تعمل من داخل نظام <b>مسار 360</b> فقط<br><span style="font-size:14px;opacity:.8">افتحها من قسم الأسطول ← «🖥️ داشبورد الأسطول»، أو من الشاشة التنفيذية</span><br><a href="./" style="color:#5FD8FF;font-size:15px">الانتقال إلى مسار 360</a></div>';
    document.body.appendChild(m);
  }
})();
startLive();
