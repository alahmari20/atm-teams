<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>مسار 360 — تأكيد استلام العطل</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:#0b1622;color:#e6eef5;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:18px}
.card{width:100%;max-width:440px;background:#11212f;border:1px solid #24405a;border-radius:16px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
h1{font-size:19px;margin:0 0 4px;color:#e3a948}
.sub{color:#8aa3b8;font-size:13px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1b3247;font-size:14.5px}
.row b{color:#fff;direction:ltr;unicode-bidi:plaintext;text-align:left}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;margin-top:16px;font-family:inherit;text-align:center;text-decoration:none}
.pri{background:#34d399;color:#05261a}.pri:disabled{opacity:.6}
.sec{background:#1b3247;color:#e6eef5}
.msg{border-radius:12px;padding:14px;margin-top:14px;font-size:15px;line-height:1.7}
.ok{background:rgba(52,211,153,.12);border:1px solid #34d399;color:#d1fae5}
.err{background:rgba(248,113,113,.12);border:1px solid #f87171;color:#fecaca}
.note{color:#8aa3b8;font-size:12.5px;margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<div class="card" id="app"><h1>مسار 360</h1><div class="sub">جارٍ تحميل بيانات التكليف…</div></div>
<script>
(function(){
  /* صفحة تأكيد استلام عطل صراف — تُفتح من رابط واتساب: ack.html?f=<رقم البلاغ>&t=<رمز الموظف>
     تكتب الاستلام وموقع الموظف داخل سجل البلاغ نفسه (recon_events, k=atmf|<id>) فيظهر فورًا في شاشة الأعطال. */
  var CLOUD={url:'https://yauthjihdjknifaqqotf.supabase.co',key:'sb_publishable_7pBC0I2sxhm2JLUpK29Eeg_IJAM6TX9'};
  var ST={open:'بانتظار التكليف',assigned:'قيد المعالجة',vendor:'محوّل إلى الشركة الموردة',closed:'مغلق',cancelled:'ملغى'};
  var app=document.getElementById('app');
  var qs=new URLSearchParams(location.search),FID=(qs.get('f')||'').trim(),TK=(qs.get('t')||'').trim();
  var OFF=0;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function p2(n){return (n<10?'0':'')+n;}
  function dt(iso){var d=new Date(iso);if(!iso||isNaN(d))return '—';return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());}
  function nowISO(){return new Date(Date.now()+OFF).toISOString();}
  function km(a,b){if(!a||!b)return null;var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));}
  function fkm(k){return k==null?'':(k<1?(Math.round(k*1000)+' م'):(k.toFixed(k<10?1:0)+' كم'));}
  function hdr(extra){var h={apikey:CLOUD.key,Authorization:'Bearer '+CLOUD.key};for(var k in extra)h[k]=extra[k];return h;}
  function fail(t){app.innerHTML='<h1>مسار 360</h1><div class="sub">تأكيد استلام العطل</div><div class="msg err">'+t+'</div>';}
  async function load(){
    var t0=Date.now();
    var res=await fetch(CLOUD.url+'/rest/v1/recon_events?select=*&k=eq.'+encodeURIComponent('atmf|'+FID),{headers:hdr({}),cache:'no-store'});
    var t1=Date.now(),hd=res.headers.get('date'),srv=hd?Date.parse(hd):NaN;if(!isNaN(srv))OFF=(srv+500)-Math.round((t0+t1)/2);
    if(!res.ok)throw new Error('http '+res.status);
    var rows=await res.json();if(!rows||!rows[0])return null;
    var row=rows[0],d=typeof row.data==='string'?JSON.parse(row.data):row.data;return {row:row,d:d};
  }
  /* التحقق من هوية المستلم — نفس دالتي mfNidNorm/mfVH في النظام حرفيًا (PBKDF2-SHA256، 100000 دورة، ملح = رمز التكليف) */
  var MAXF=5;
  function nidNorm(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c);}).replace(/[۰-۹]/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(c);}).trim().replace(/\.0+$/,'').replace(/\D/g,'');}
  async function vh(tk,nid){var n=nidNorm(nid);if(!n||n.length<6||!tk)return '';var te=new TextEncoder();
    var k=await crypto.subtle.importKey('raw',te.encode(n),'PBKDF2',false,['deriveBits']);
    var b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode('m360ack|'+tk),iterations:100000,hash:'SHA-256'},k,256);
    return Array.prototype.map.call(new Uint8Array(b),function(x){return (x<16?'0':'')+x.toString(16);}).join('');}
  async function save(L,d,by,at){var r=L.row;
    var body={k:r.k,date:r.date||d.fdate||'',city:r.city||d.nb||'',center_id:d.st||'',kind:'atmf',data:JSON.stringify(d),updated_by:by,updated_at:at,deleted:false};
    var res=await fetch(CLOUD.url+'/rest/v1/recon_events?on_conflict=k',{method:'POST',headers:hdr({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)});
    if(!res.ok)throw new Error('http '+res.status);}
  /* سبب منع التأكيد (أو '' إن كان مسموحًا) */
  function blockReason(d,e){
    if(e.v!==2)return 'هذا الرابط من إصدار سابق — اطلب من مسؤول الفرع إعادة اعتماد التكليف وإرسال رابط جديد.';
    if(e.lock)return 'أُوقف هذا الرابط بعد '+MAXF+' محاولات برقم هوية غير مطابق. راجع مسؤول الفرع لإعادة اعتماد التكليف.';
    if(!e.vh)return 'لا يوجد رقم هوية مسجل لك في النظام، فلا يمكن التحقق من هويتك. راجع مسؤول الفرع لتسجيل رقم الهوية ثم إعادة الإرسال.';
    if(d.st!=='assigned')return 'البلاغ لم يعد قيد المعالجة (الحالة: '+esc(ST[d.st]||d.st)+').';
    return '';}
  function findEmp(d){var a=d&&d.as||[];for(var i=0;i<a.length;i++)if(a[i]&&a[i].tk&&a[i].tk===TK)return i;return -1;}
  function info(d,e){
    var ll=d.loc;
    return '<div class="row"><span>الموظف</span><b>'+esc(e.n)+(e.eid?(' #'+esc(e.eid)):'')+'</b></div>'
      +'<div class="row"><span>رقم البلاغ</span><b>'+esc(d.id)+'</b></div>'
      +'<div class="row"><span>رقم الجهاز</span><b>'+esc(d.atm)+'</b></div>'
      +(d.site?'<div class="row"><span>الموقع</span><b>'+esc(d.site)+'</b></div>':'')
      +'<div class="row"><span>البنك</span><b>'+esc(d.bank||'—')+'</b></div>'
      +'<div class="row"><span>تاريخ العطل</span><b>'+esc(d.fdate||'—')+'</b></div>'
      +'<div class="row"><span>وقت البلاغ</span><b>'+dt(d.rep)+'</b></div>'
      +(ll?'<a class="btn sec" target="_blank" rel="noopener" href="https://maps.google.com/?q='+(+ll.lat).toFixed(6)+','+(+ll.lng).toFixed(6)+'">📍 فتح موقع الجهاز في Google Maps</a>':'');
  }
  function done(d,e,fresh){
    var a=e.ack,k=(a&&a.dist!=null)?a.dist:null;
    app.innerHTML='<h1>✅ تم تأكيد الاستلام</h1><div class="sub">مسار 360 — أعطال الصرافات</div>'+info(d,e)
      +'<div class="msg ok">سُجّل استلامك للعطل في '+dt(a.at)+(k!=null?('<br>المسافة من موقعك إلى الجهاز: <b>'+fkm(k)+'</b> (خط مستقيم)'):(a.noloc?'<br>لم يُسجَّل موقعك (لم يُمنح إذن الموقع).':''))
      +'<br>يظهر الآن لدى المساندة والمراقبة والتحكم أنك استلمت العطل.</div><div id="trk"></div>';
    trkPanel(d,e,fresh);
  }
  /* ───────── تتبع الموقع بعد الاستلام حتى الوصول للجهاز (2026-11-05) ─────────
     الصفحة ترسل موقع الموظف أثناء فتحها إلى صف مستقل recon_events kind=atmftrk (المفتاح atmftrk|<البلاغ>|<ترتيب الموظف>)،
     فتعرضه العمليات المركزية على الخريطة. يتوقف عند الوصول (150 م من الجهاز) أو «وصلت» أو إغلاق البلاغ أو بعد 6 ساعات. */
  var TR={w:null,wl:null,last:null,lastSent:0,sent:0,start:'',pts:[],d:null,e:null,i:-1,busy:false,arr:null},VKEY='m360v|'+FID+'|'+TK;
  function trkEl(){return document.getElementById('trk');}
  function arrHtml(a){return '<div class="msg ok" id="tarrmsg">🏁 سُجّل وصولك إلى موقع الجهاز في '+dt(a.at)+(a.dist!=null?(' (على بعد '+fkm(a.dist)+')'):'')+'.</div>';}
  function showBtn(id,on){var b=document.getElementById(id);if(b)b.style.display=on?'block':'none';}
  /* المشاركة لا يوقفها الموظف (طلب المالك 2026-11-05): تبدأ تلقائيًا وتستمر ما دامت الصفحة مفتوحة حتى يُغلق العطل أو يُلغى أو يتغير المكلفون */
  function trkPanel(d,e,fresh){
    var el=trkEl();if(!el)return;TR.d=d;TR.e=e;TR.i=findEmp(d);TR.arr=e.arr||null;
    var am=e.arr?arrHtml(e.arr):'';
    if(d.st!=='assigned'){el.innerHTML=am;return;}
    var ok=false;try{ok=localStorage.getItem(VKEY)==='1';}catch(x){}
    if(fresh||ok){try{localStorage.setItem(VKEY,'1');}catch(x){}
      el.innerHTML=am+'<div class="msg" style="background:rgba(45,212,191,.08);border:1px solid #2dd4bf;color:#ccfbf1">🚗 <b>مشاركة موقعك مع العمليات المركزية</b><br>تتابع العمليات المركزية موقعك على الخريطة حتى إغلاق العطل. أبقِ هذه الصفحة مفتوحة والشاشة تعمل؛ تنتهي المشاركة تلقائيًا عند إغلاق العطل.</div>'
        +'<div id="tst" class="note" style="font-size:14px;color:#e6eef5"></div>'
        +'<button class="btn pri" id="tgo" style="display:none">📡 إعادة تشغيل مشاركة الموقع</button>'
        +(e.arr?'':'<button class="btn sec" id="tarr" style="display:none">🏁 وصلت إلى الجهاز</button>');
      document.getElementById('tgo').onclick=trkStart;
      var ta=document.getElementById('tarr');if(ta)ta.onclick=function(){trkArrive(true);};
      trkStart();
      return;}
    el.innerHTML=am+'<div class="note" style="margin-top:14px">لمشاركة موقعك مع العمليات المركزية من هذا الجوال، اكتب رقم هويتك:</div>'
      +'<input id="nid" type="tel" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="رقم الهوية / الإقامة" style="width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #24405a;background:#0b1622;color:#fff;font-size:17px;text-align:center;direction:ltr">'
      +'<div id="nmsg" style="color:#fca5a5;font-size:13.5px;margin-top:8px;min-height:18px"></div><button class="btn pri" id="tver">📡 متابعة مشاركة الموقع</button>';
    var b=document.getElementById('tver');b.onclick=async function(){
      var raw=nidNorm(document.getElementById('nid').value),msg=document.getElementById('nmsg');if(raw.length<6){msg.textContent='اكتب رقم الهوية كاملًا.';return;}
      b.disabled=true;var r=await checkId(raw).catch(function(){return {ok:false,msg:'تعذّر الاتصال — أعد المحاولة.'};});b.disabled=false;
      if(r.fatal)return fail(r.fatal);if(!r.ok){msg.textContent=r.msg;return;}
      try{localStorage.setItem(VKEY,'1');}catch(x){}done(r.d,r.e,false);};
  }
  function trkSt(t){var s=document.getElementById('tst');if(s)s.innerHTML=t;}
  function trkBody(state,extra){var d=TR.d,e=TR.e,data={fid:FID,i:TR.i,n:e.n,eid:e.eid||'',start:TR.start,last:TR.last,pts:TR.pts,dist:(TR.last&&d.loc)?+km(TR.last,d.loc).toFixed(3):null};
    if(TR.arr)data.arr=TR.arr;
    for(var k in (extra||{}))data[k]=extra[k];
    return {k:'atmftrk|'+FID+'|'+TR.i,date:d.fdate||'',city:d.nb||'',center_id:state,kind:'atmftrk',data:JSON.stringify(data),updated_by:'trk:'+e.n,updated_at:nowISO(),deleted:false};}
  async function trkPut(state,extra){
    var res=await fetch(CLOUD.url+'/rest/v1/recon_events?on_conflict=k',{method:'POST',headers:hdr({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(trkBody(state,extra))});
    if(!res.ok)throw new Error('http '+res.status);}
  async function trkStart(){
    if(!navigator.geolocation){trkSt('⚠️ هذا الجوال لا يدعم تحديد الموقع.');return;}
    if(TR.w!=null)return;
    TR.start=TR.start||nowISO();
    showBtn('tgo',false);showBtn('tarr',!TR.arr);
    trkSt('⏳ جارٍ تحديد موقعك…');
    try{if(navigator.wakeLock)TR.wl=await navigator.wakeLock.request('screen');}catch(x){}
    TR.w=navigator.geolocation.watchPosition(trkOnPos,function(err){
      if(err&&err.code===1){trkHalt();showBtn('tgo',true);trkSt('⚠️ لم يُمنح إذن الموقع — فعّله من إعدادات المتصفح ثم اضغط «إعادة تشغيل مشاركة الموقع».');return;}
      trkSt('⚠️ تعذّر تحديد الموقع حاليًا — تأكد من تشغيل GPS. سيُعاد المحاولة تلقائيًا.');
    },{enableHighAccuracy:true,maximumAge:10000,timeout:30000});
  }
  /* إعادة طلب منع إطفاء الشاشة عند العودة للصفحة */
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&TR.w!=null&&navigator.wakeLock){navigator.wakeLock.request('screen').then(function(w){TR.wl=w;}).catch(function(){});}});
  async function trkOnPos(p){
    var now=Date.now(),pos={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),at:nowISO()};
    if(TR.ended)return;
    var d=TR.d,dist=d.loc?km(pos,d.loc):null;
    trkSt('📡 المشاركة تعمل'+(dist!=null?(' — المسافة إلى الجهاز: <b>'+fkm(dist)+'</b>'):'')+' · دقة ±'+pos.acc+' م'+(TR.lastSent?(' · آخر إرسال '+new Date(TR.lastSent).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})):''));
    if(!TR.arr&&dist!=null&&dist<=0.15&&pos.acc<=100){TR.last=pos;trkArrive(false);return;}
    var moved=TR.last?km(TR.last,pos):1;
    /* قبل الوصول: كل 20–60 ث؛ بعد الوصول: كل دقيقتين أو عند الابتعاد 100 م */
    var maxGap=TR.arr?120000:60000,minMove=TR.arr?0.1:0.04;
    if(TR.busy||(TR.lastSent&&(now-TR.lastSent<20000||(moved<minMove&&now-TR.lastSent<maxGap))))return;
    TR.busy=true;TR.last=pos;TR.pts.push(pos);if(TR.pts.length>150)TR.pts=TR.pts.slice(-150);
    try{await trkPut(TR.arr?'arr':'live');TR.lastSent=Date.now();TR.sent++;
      if(TR.sent%4===0){var L=await load();var i=L?findEmp(L.d):-1;
        if(!L||i<0){TR.busy=false;return trkStop('تغيّر الموظفون المكلفون بالبلاغ');}
        if(L.d.st!=='assigned'){TR.busy=false;return trkStop(L.d.st==='closed'?'أُغلق العطل':('حالة البلاغ: '+(ST[L.d.st]||L.d.st)));}
        TR.d=L.d;TR.e=L.d.as[i];if(TR.e.arr&&!TR.arr)TR.arr=TR.e.arr;}
    }catch(x){trkSt('⚠️ تعذّر إرسال الموقع — تحقق من الإنترنت. سيُعاد الإرسال تلقائيًا.');}
    TR.busy=false;
  }
  function trkHalt(){if(TR.w!=null){navigator.geolocation.clearWatch(TR.w);TR.w=null;}try{if(TR.wl)TR.wl.release();}catch(x){}TR.wl=null;}
  /* تُستدعى من النظام فقط (إغلاق العطل/إلغاؤه/تغيير المكلفين) — لا يوجد زر إيقاف للموظف */
  async function trkStop(reason){
    TR.ended=true;trkHalt();
    try{await trkPut('stop',{stop:reason,stopAt:nowISO()});}catch(x){}
    var el=trkEl();if(el)el.innerHTML=(TR.arr?arrHtml(TR.arr):'')+'<div class="msg" style="background:#1b3247;border:1px solid #24405a">⏹ انتهت مشاركة الموقع ('+esc(reason)+'). شكرًا لك.</div>';
  }
  /* تسجيل الوصول (تلقائي ضمن 150 م أو بزر «وصلت») — المشاركة تستمر بعده حتى إغلاق العطل */
  async function trkArrive(manual){
    if(TR.arr)return;
    var d=TR.d,dist=(TR.last&&d.loc)?km(TR.last,d.loc):null;
    if(manual&&dist!=null&&dist>0.5&&!confirm('موقعك الحالي يبعد '+fkm(dist)+' عن الجهاز. هل وصلت فعلًا؟'))return;
    var at=nowISO(),arr={at:at,dist:dist!=null?+dist.toFixed(3):null,manual:!!manual};TR.arr=arr;
    showBtn('tarr',false);
    var el=trkEl();if(el&&!document.getElementById('tarrmsg'))el.insertAdjacentHTML('afterbegin',arrHtml(arr));
    try{await trkPut('arr');TR.lastSent=Date.now();}catch(x){}
    try{var L=await load();var i=L?findEmp(L.d):-1;
      if(L&&i>=0&&!L.d.as[i].arr){var dd=L.d,e=dd.as[i];e.arr=arr;
        dd.log=dd.log||[];dd.log.push({at:at,by:e.n,a:'وصل إلى موقع الجهاز',t:e.n+(arr.dist!=null?(' — على بعد '+fkm(arr.dist)+' من الجهاز'):'')+(manual?' (تأكيد يدوي)':' (تلقائي عند الاقتراب)')});
        await save(L,dd,'arr:'+e.n,at);TR.e=e;TR.d=dd;}}catch(x){}
  }
  /* التحقق من الهوية — يُرجع {ok,L,d,e} أو {ok:false,msg} أو {fatal} ويسجّل المحاولة الخاطئة */
  async function checkId(raw){
    var L=await load();if(!L)return {fatal:'لم يُعثر على البلاغ.'};
    var d=L.d,i=findEmp(d);if(i<0)return {fatal:'هذا الرابط لم يعد صالحًا — ربما تغيّر الموظفون المكلفون بالبلاغ. راجع مسؤول الفرع.'};
    var e=d.as[i];if(e.lock||e.v!==2||!e.vh)return {fatal:blockReason(d,e)};
    var h=await vh(TK,raw);if(h===e.vh)return {ok:true,L:L,d:d,e:e};
    var at0=nowISO();e.fails=(e.fails||0)+1;e.failAt=at0;if(e.fails>=MAXF)e.lock=true;
    d.log=d.log||[];d.log.push({at:at0,by:'رابط '+e.n,a:'محاولة تحقق برقم هوية غير مطابق',t:'المحاولة '+e.fails+' من '+MAXF+(e.lock?' — أُوقف الرابط':'')});
    await save(L,d,'ack-fail:'+e.n,at0);
    if(e.lock)return {fatal:blockReason(d,e)};
    return {ok:false,msg:'رقم الهوية غير مطابق للموظف المكلف. المتبقي '+(MAXF-e.fails)+' محاولات قبل إيقاف الرابط. سُجّلت المحاولة لدى المراقبة.'};
  }
  function getPos(){return new Promise(function(ok){
    if(!navigator.geolocation)return ok(null);
    navigator.geolocation.getCurrentPosition(function(p){ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});},function(){ok(null);},{enableHighAccuracy:true,timeout:20000,maximumAge:60000});
  });}
  async function confirmAck(btn){
    var inp=document.getElementById('nid'),msg=document.getElementById('nmsg');
    var raw=nidNorm(inp.value);if(raw.length<6){msg.textContent='اكتب رقم الهوية الوطنية أو الإقامة كاملًا (10 أرقام).';inp.focus();return;}
    btn.disabled=true;btn.textContent='جارٍ التحقق…';msg.textContent='';
    try{
      var L=await load();if(!L)return fail('لم يُعثر على البلاغ.');
      var d=L.d,i=findEmp(d);if(i<0)return fail('هذا الرابط لم يعد صالحًا — ربما تغيّر الموظفون المكلفون بالبلاغ. راجع مسؤول الفرع.');
      var e=d.as[i];if(e.ack)return done(d,e);
      var br=blockReason(d,e);if(br)return fail(br);
      var h=await vh(TK,raw);
      if(h!==e.vh){
        var at0=nowISO();e.fails=(e.fails||0)+1;e.failAt=at0;if(e.fails>=MAXF)e.lock=true;
        d.log=d.log||[];d.log.push({at:at0,by:'رابط '+e.n,a:'محاولة تأكيد استلام برقم هوية غير مطابق',t:'المحاولة '+e.fails+' من '+MAXF+(e.lock?' — أُوقف الرابط':'')});
        await save(L,d,'ack-fail:'+e.n,at0);
        if(e.lock)return fail(blockReason(d,e));
        btn.disabled=false;btn.textContent='📥 تأكيد استلام العطل';inp.value='';
        msg.textContent='رقم الهوية غير مطابق للموظف المكلف. المتبقي '+(MAXF-e.fails)+' محاولات قبل إيقاف الرابط. سُجّلت المحاولة لدى المراقبة.';return;
      }
      btn.textContent='جارٍ تحديد موقعك…';
      var pos=await getPos();
      btn.textContent='جارٍ التسجيل…';
      L=await load();d=L.d;i=findEmp(d);if(i<0)return fail('هذا الرابط لم يعد صالحًا — راجع مسؤول الفرع.');
      e=d.as[i];if(e.ack)return done(d,e);br=blockReason(d,e);if(br)return fail(br);
      var at=nowISO();
      e.ack={at:at,lat:pos?+pos.lat.toFixed(6):null,lng:pos?+pos.lng.toFixed(6):null,acc:pos?Math.round(pos.acc):null,noloc:!pos,idv:true};
      if(pos&&d.loc)e.ack.dist=+km(pos,d.loc).toFixed(2);
      d.log=d.log||[];d.log.push({at:at,by:e.n,a:'تأكيد استلام العطل (رابط واتساب + التحقق من الهوية)',t:e.n+(e.ack.dist!=null?(' — يبعد '+fkm(e.ack.dist)+' عن الجهاز'):(pos?'':' — بدون موقع'))});
      await save(L,d,'ack:'+e.n,at);
      done(d,e,true);
    }catch(err){btn.disabled=false;btn.textContent='📥 إعادة المحاولة';alert('تعذّر التسجيل — تحقق من اتصال الإنترنت ثم أعد المحاولة.');}
  }
  (async function(){
    if(!FID||!TK)return fail('الرابط غير مكتمل. افتحه كما وصلك في رسالة واتساب.');
    try{
      var L=await load();if(!L)return fail('لم يُعثر على البلاغ '+esc(FID)+'.');
      var d=L.d,i=findEmp(d);if(i<0)return fail('هذا الرابط لم يعد صالحًا — ربما تغيّر الموظفون المكلفون بالبلاغ. راجع مسؤول الفرع.');
      var e=d.as[i];if(e.ack)return done(d,e);
      var br=blockReason(d,e);if(br)return fail(br);
      if(!(window.crypto&&crypto.subtle))return fail('هذا المتصفح لا يدعم التحقق الآمن — افتح الرابط في Chrome أو Safari.');
      app.innerHTML='<h1>📥 تأكيد استلام العطل</h1><div class="sub">مسار 360 — أعطال الصرافات</div>'+info(d,e)
        +'<label for="nid" style="display:block;margin-top:16px;font-size:14px;font-weight:700">للتحقق أن المستلم هو الموظف المكلف: اكتب رقم هويتك الوطنية / الإقامة</label>'
        +'<input id="nid" type="tel" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="10 أرقام" style="width:100%;margin-top:8px;padding:13px;border-radius:12px;border:1px solid #24405a;background:#0b1622;color:#fff;font-size:18px;text-align:center;letter-spacing:2px;direction:ltr">'
        +'<div id="nmsg" style="color:#fca5a5;font-size:13.5px;margin-top:8px;min-height:18px"></div>'
        +'<button class="btn pri" id="ok">📥 تأكيد استلام العطل</button>'
        +'<div class="note">رقم الهوية لا يُرسل ولا يُحفظ — يُطابَق على جهازك فقط. هذا الرابط خاص بك؛ إن وصل لغيرك فلن يستطيع تأكيده، وكل محاولة خاطئة تُسجَّل لدى المراقبة ويتوقف الرابط بعد '+MAXF+' محاولات.<br>بعد التحقق سيطلب الجوال إذن الموقع: يُسجَّل موقعك عند الاستلام، ثم تُشارك موقعك مع العمليات المركزية حتى إغلاق العطل فقط.</div>';
      var b=document.getElementById('ok');b.onclick=function(){confirmAck(b);};
      document.getElementById('nid').onkeydown=function(ev){if(ev.key==='Enter')confirmAck(b);};
    }catch(err){fail('تعذّر الاتصال بالنظام — تحقق من الإنترنت ثم أعد فتح الرابط.');}
  })();
})();
</script>
